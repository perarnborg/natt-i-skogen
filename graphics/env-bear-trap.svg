<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" width="180" height="150">
  <defs>
    <linearGradient id="trapSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B848C" />
      <stop offset="55%" stop-color="#4A5056" />
      <stop offset="100%" stop-color="#282C30" />
    </linearGradient>
    <radialGradient id="trapPlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#635147" />
      <stop offset="100%" stop-color="#362A24" />
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <g id="shadow">
    <ellipse cx="90" cy="96" rx="68" ry="26" fill="#06090F" opacity="0.6" />
  </g>

  <!-- Anchor Chain & Wooden Stake Driven Into Ground -->
  <g id="chain">
    <ellipse cx="142" cy="118" rx="8" ry="4" fill="none" stroke="#4A5056" stroke-width="3.5" />
    <ellipse cx="152" cy="122" rx="8" ry="4" fill="none" stroke="#383D42" stroke-width="3.5" />
    <path d="M156 108 L166 108 L163 130 L158 130 Z" fill="#6E4728" stroke="#14100E" stroke-width="3" stroke-linejoin="round" />
  </g>

  <!-- Side Spring Coils -->
  <g id="springs">
    <path d="M18 92 L42 86 L42 102 L18 98 Z" fill="#383D42" stroke="#14100E" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M162 92 L138 86 L138 102 L162 98 Z" fill="#383D42" stroke="#14100E" stroke-width="3.5" stroke-linejoin="round" />
  </g>

  <!-- Center Pressure Trigger Pan -->
  <g id="trigger-pan">
    <line x1="42" y1="94" x2="138" y2="94" stroke="#282C30" stroke-width="5" />
    <ellipse cx="90" cy="94" rx="22" ry="12" fill="url(#trapPlate)" stroke="#14100E" stroke-width="3.5" />
    <circle cx="90" cy="94" r="4" fill="#8C332B" />
  </g>

  <!-- Open Serrated Jaws (3/4 Top-Down Perspective) -->
  <g id="jaws-open">
    <!-- Upper Jaw Arch -->
    <path d="M36 90 C38 52, 142 52, 144 90 L132 90 C130 64, 50 64, 48 90 Z" fill="url(#trapSteel)" stroke="#14100E" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Upper Jaw Serrated Teeth pointing inward -->
    <polygon points="54,75 60,84 65,72" fill="#B0B8BF" stroke="#14100E" stroke-width="2" stroke-linejoin="round" />
    <polygon points="71,69 76,80 82,67" fill="#B0B8BF" stroke="#14100E" stroke-width="2" stroke-linejoin="round" />
    <polygon points="88,67 90,79 95,67" fill="#B0B8BF" stroke="#14100E" stroke-width="2" stroke-linejoin="round" />
    <polygon points="101,67 105,80 111,69" fill="#B0B8BF" stroke="#14100E" stroke-width="2" stroke-linejoin="round" />
    <polygon points="116,72 120,84 126,75" fill="#B0B8BF" stroke="#14100E" stroke-width="2" stroke-linejoin="round" />

    <!-- Lower Jaw Arch -->
    <path d="M36 96 C38 134, 142 134, 144 96 L132 96 C130 122, 50 122, 48 96 Z" fill="url(#trapSteel)" stroke="#14100E" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Lower Jaw Serrated Teeth pointing upward -->
    <polygon points="54,111 60,102 65,114" fill="#B0B8BF" stroke="#14100E" stroke-width="2" stroke-linejoin="round" />
    <polygon points="71,117 76,106 82,119" fill="#B0B8BF" stroke="#14100E" stroke-width="2" stroke-linejoin="round" />
    <polygon points="88,119 90,107 95,119" fill="#B0B8BF" stroke="#14100E" stroke-width="2" stroke-linejoin="round" />
    <polygon points="101,119 105,106 111,117" fill="#B0B8BF" stroke="#14100E" stroke-width="2" stroke-linejoin="round" />
    <polygon points="116,114 120,102 126,111" fill="#B0B8BF" stroke="#14100E" stroke-width="2" stroke-linejoin="round" />

    <!-- Hinge Rivets -->
    <circle cx="42" cy="93" r="4.5" fill="#9AA5B1" stroke="#14100E" stroke-width="2" />
    <circle cx="138" cy="93" r="4.5" fill="#9AA5B1" stroke="#14100E" stroke-width="2" />
  </g>
</svg>
